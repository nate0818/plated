<style>

#plated-complete .p-profile-edit-action{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--p-muted);padding:8px 0 8px 10px}
#plated-complete .p-profile-edit-action svg{width:15px;height:15px}
#plated-complete .p-calendar-controls{display:flex;align-items:center;gap:10px;margin:12px 0 5px}
#plated-complete .p-calendar-switch{display:flex;background:var(--p-well);border-radius:14px;padding:3px;margin-right:auto}
#plated-complete .p-calendar-switch button{min-height:40px;padding:0 16px;border-radius:11px;font-size:14px}
#plated-complete .p-calendar-switch button[aria-pressed=true]{background:var(--p-surface);box-shadow:0 1px 4px #00000015}
#plated-complete .p-calendar-arrows{display:flex;gap:0}
#plated-complete .p-calendar-arrows .p-icon{min-width:38px}
#plated-complete .p-calendar-nav{display:flex;align-items:center;gap:4px;margin:12px 0}
#plated-complete .p-calendar-nav strong{margin-right:auto;font-size:16px}
#plated-complete .p-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 0;margin:0 -8px}
#plated-complete .p-month-grid .p-weekday{text-align:center;color:var(--p-muted);font-size:12px;padding:6px 0;font-weight:600}
#plated-complete .p-month-grid button{min-height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
#plated-complete .p-month-grid button:disabled{background:transparent;color:var(--p-muted);opacity:.55}
#plated-complete .p-month-grid button span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:650}
#plated-complete .p-month-grid button.is-today span{color:var(--p-brand)}
#plated-complete .p-month-grid button[aria-pressed=true] span{background:var(--p-brand);color:var(--p-ink)}
#plated-complete .p-month-grid button i{width:4px;height:4px;background:var(--p-muted);border-radius:50%}
#plated-complete .p-selected-meal-actions{display:flex;justify-content:space-between;border-top:1px solid var(--p-rule);margin-top:10px;padding-top:4px}
#plated-complete .p-week-agenda .p-mealrow{min-height:82px;padding:8px 0}
#plated-complete .p-today-row .p-rowdate{background:var(--p-brand);color:var(--p-ink);border-radius:14px;padding:7px 0}
#plated-complete .p-nav{background:light-dark(#fffaf4d9,#251f18e8);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 4px 22px #00000012,inset 0 1px #ffffff44}
@media(prefers-reduced-transparency:reduce){#plated-complete .p-nav{background:var(--p-surface);backdrop-filter:none}}
#plated-complete .p-week-agenda{margin-top:6px}
#plated-complete .p-week-agenda .p-agenda-row{min-height:80px;display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;border-bottom:1px solid var(--p-rule);border-radius:0}
#plated-complete .p-week-agenda .p-agenda-row:disabled{background:transparent;opacity:1}
#plated-complete .p-agenda-date{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;gap:4px}
#plated-complete .p-agenda-date small{font-size:10px;font-weight:650;line-height:1;letter-spacing:.5px;text-transform:uppercase;color:var(--p-muted)}
#plated-complete .p-agenda-date>span{height:30px;width:30px;display:grid;place-items:center;font-family:'Gabarito',sans-serif;font-size:21px;font-weight:600;line-height:1;color:var(--p-ink);border-radius:50%}
#plated-complete .p-agenda-today .p-agenda-date>span{background:var(--p-brand);color:var(--p-onbrand);font-size:17px}
#plated-complete .p-agenda-photo{width:46px;height:46px;flex:0 0 46px;object-fit:cover;border-radius:12px}
#plated-complete .p-agenda-empty{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;color:var(--p-muted)}
#plated-complete .p-agenda-empty svg{width:18px;height:18px;stroke-width:1.4}
#plated-complete .p-agenda-row .p-rowcopy{min-width:0;flex:1}
#plated-complete .p-agenda-row .p-rowcopy strong{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:650;line-height:1.45}
#plated-complete .p-agenda-row .p-rowcopy small{font-size:11px;line-height:1.5;margin-top:3px}
#plated-complete .p-agenda-row>svg{width:14px;height:14px;color:var(--p-muted);flex:0 0 14px}
#plated-complete .p-agenda-open .p-rowcopy strong{font-weight:500;color:var(--p-muted)}
#plated-complete .p-agenda-open:not(:disabled) .p-rowcopy strong{color:var(--p-ink)}
#plated-complete .p-datebar>button:first-child{font-size:14px;font-weight:600}
#plated-complete .p-dismiss-backdrop{position:absolute;inset:0;width:100%;height:100%;padding:0;background:transparent;border-radius:0;z-index:0}#plated-complete .p-sheet{position:relative;z-index:1}
#plated-complete .p-week-agenda .p-agenda-row:disabled{min-height:54px;padding:5px 0}
#plated-complete .p-agenda-row:disabled .p-agenda-date>span{font-size:19px;height:25px}
#plated-complete .p-dismiss-backdrop{height:auto;bottom:60%;}

#plated-complete .p-step-grip{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 8px 0 0;touch-action:none;cursor:grab}
#plated-complete .p-hold-option{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;border-bottom:1px solid var(--p-rule)}
#plated-complete .p-hold-option svg:last-child{margin-left:auto}
#plated-complete .p-hold-option svg:first-child{margin-left:0}
#plated-complete .p-hold-option[aria-pressed] svg{margin-left:auto}
#plated-complete .p-drag-ghost{position:absolute;z-index:35;pointer-events:none;user-select:none;background:var(--p-surface);color:var(--p-ink);border-radius:16px;box-shadow:0 14px 36px var(--p-shadow);transform:scale(1.02);margin:0;padding:12px;opacity:.98}
#plated-complete .p-drag-ghost.p-mealrow{display:flex;align-items:center;gap:12px}
#plated-complete .p-drag-source{opacity:.22}
#plated-complete .p-drop-target{outline:2px solid var(--p-brand);outline-offset:-2px;background:var(--p-well);border-radius:14px}
#plated-complete .p-step-drop{position:relative}
#plated-complete .p-step-drop:before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--p-brand);top:-8px}
#plated-complete .p-step-drop[data-drop-position=after]:before{top:auto;bottom:-8px}
#plated-complete .p-drag-status{position:absolute;left:16px;right:16px;bottom:98px;z-index:36;background:var(--p-ink);color:var(--p-paper);padding:12px 16px;border-radius:16px;font-size:13px;pointer-events:none;text-align:center}
</style>

const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(a,label,cls='p-link',extra='')=>`<button type="button" class="${cls}" data-action="${a}" ${extra}>${label}</button>`;

function updateHeldTarget(){
  const h=holdState;if(!h?.active)return;h.target=null;
  main.querySelectorAll('.p-drop-target,.p-step-drop').forEach(el=>{el.classList.remove('p-drop-target','p-step-drop');delete el.dataset.dropPosition});
  const hit=document.elementFromPoint(h.lastX,h.lastY);if(!hit||!main.contains(hit))return;
  if(h.kind==='meal'){
    const target=hit.closest('[data-open-date],[data-calendar-day]'),date=target?.dataset.openDate||target?.dataset.calendarDay,m=meal(h.id);
    if(!date||date===m?.date||date<todayDate||m?.done)return;
    const other=data.meals.find(x=>x.date===date&&x.id!==h.id);if(other?.done)return;
    h.target=date;(target.closest('.p-swipe')||target).classList.add('p-drop-target');
    const text=other?'Swap with '+other.snapshot.title:'Move to '+dateLabel(date).toLowerCase();if(h.hint.textContent!==text)h.hint.textContent=text;
  }else{
    const target=hit.closest('[data-step-row]');if(!target||target===h.row)return;

    h.target={id:target.dataset.stepRow,after};target.classList.add('p-step-drop');target.dataset.dropPosition=after?'after':'before';

function finishHold(e,cancelled=false){
  const h=holdState;if(!h||h.pointer!==e.pointerId)return;

  if(cancelled)return;
  if(!h.moved){if(h.kind==='meal')mealHoldOptions(h.id);else stepHoldOptions(h.id);return}
  if(!h.target)return;
  if(h.kind==='meal'){
    const m=meal(h.id),other=data.meals.find(x=>x.date===h.target&&x.id!==h.id);if(!m||m.done||other?.done||h.target<todayDate)return;
    const old=m.date;commit(other?'Swap dinners':'Move dinner',()=>{m.date=h.target;if(other)other.date=old});selectedDate=h.target;
    render();announce(other?'Dinners swapped.':'Dinner moved to '+dateLabel(h.target).toLowerCase()+'.',true);
  }else{
    const from=editorDraft.steps.findIndex(s=>s.id===h.id);if(from<0)return;
    const moved=editorDraft.steps.splice(from,1)[0],target=editorDraft.steps.findIndex(s=>s.id===h.target.id);
    editorDraft.steps.splice(target+(h.target.after?1:0),0,moved);const scroll=main.scrollTop;render();main.scrollTop=scroll;
    main.querySelector(`[data-step-grip="${h.id}"]`)?.focus({preventScroll:true});announce('Step order updated. Save to keep your changes.');
  }
}

if(a==='publish-post'){if(postDraft.pollOptions?.length&&(postDraft.pollOptions.some(x=>!x.trim())||new Set(postDraft.pollOptions.map(x=>x.trim().toLowerCase())).size!==postDraft.pollOptions.length)){main.querySelector('[data-post-error]').textContent='Give each poll choice a different name.';return}if(!postDraft.title.trim()){main.querySelector('[data-post-error]').textContent='Give your dish a name.';return}if(options.scenario==='error'){main.querySelector('[data-post-error]').textContent='Your post couldn’t be sent. Your draft is still here.';return}commit('Post dish',()=>{const p={...clone(postDraft),id:postDraft.editId||uid(),author:'You',date:'Just now · Preview only',reacted:false,replies:[],saved:false,recipeCopy:postDraft.recipeId?clone(recipe(postDraft.recipeId)):null,pollOptions:postDraft.kind==='question'?(postDraft.pollOptions||[]):[]};if(postDraft.editId)data.posts=data.posts.map(old=>old.id===postDraft.editId?{...old,title:p.title,caption:p.caption,photo:p.photo,recipeId:p.recipeId,recipeCopy:p.recipeCopy,edited:true}:old);else data.posts.unshift(p)});const wasEditing=!!postDraft.editId;postDraft=null;back();if(!wasEditing){tab='table';stacks.table=[{name:'table'}];render()}announce(wasEditing?'Post updated in this preview.':'Post added to this preview.',true);return}
if(a==='react'){const p=postById(arg);commit('Reaction change',()=>p.reacted=!p.reacted);b.outerHTML=plateButton(p);icons();return}if(a==='reply'){const p=data.posts.find(p=>p.id===arg);openModal('reply','Reply to '+p.author,`${p.replies.map(r=>`<p class="p-sub" style="margin-bottom:12px"><strong>${esc(r.author)}</strong> ${esc(r.text)}</p>`).join('')}<label class="p-formlabel" for="pc-reply">Your reply</label><textarea id="pc-reply" placeholder="Write a reply"></textarea>${primary('save-reply:'+arg,'Add reply to preview')}`);return}if(a==='save-reply'){const text=sheet.querySelector('textarea').value.trim();if(!text)return;commit('Reply',()=>data.posts.find(p=>p.id===arg).replies.push({author:'You',text}));closeModal();render();announce('Reply added to this preview.',true);return}
if(a==='save-post'){const p=data.posts.find(p=>p.id===arg);if(p.savedRecipeId&&recipe(p.savedRecipeId)){push({name:'recipe',id:p.savedRecipeId})}else if(p.recipeCopy){push({name:'recipe',id:p.recipeCopy.id,sharedPostId:p.id})}return}if(a==='post-menu'){const p=data.posts.find(p=>p.id===arg);openModal('post-menu','Post options',p.author==='You'?`${btn('edit-post:'+arg,'Edit post','p-plainrow')}${btn('delete-post:'+arg,'Delete post from preview','p-plainrow p-danger')}`:`<p class="p-sub">${esc(p.author)} shared this with ${p.audience==='household'?'your household':'everyone at your Table'}.</p>${btn('table-people-from-modal','View Table people','p-plainrow')}`);return}if(a==='table-people-from-modal'){closeModal();push({name:'people'});return}if(a==='edit-post'){postDraft={...clone(data.posts.find(p=>p.id===arg)),editId:arg};closeModal();push({name:'composer'});return}if(a==='delete-post'){commit('Delete post',()=>data.posts=data.posts.filter(p=>p.id!==arg));closeModal();if(route().name==='thread'&&route().postId===arg)back();else render();announce('Post removed from this preview.',true);return}

if(a==='appearance'){openModal('appearance','Appearance',`${[['system','Follow device'],['light','Light'],['dark','Dark']].map(([id,l])=>btn('set-appearance:'+id,`<span>${l}</span>${options.appearance===id?icon('check'):''}`,'p-plainrow')).join('')}`);return}if(a==='set-appearance'){options.appearance=arg;closeModal();render();return}
if(a==='invite-household'||a==='invite-table'){const tableOnly=a==='invite-table';openModal('invite',tableOnly?'Invite to your Table':'Invite to your household',`<p class="p-sub">${tableOnly?'A Table guest sees dishes and replies.':'A household member can help with the dinner plan and groceries.'}</p><label class="p-formlabel" for="pc-invite">Invitation draft</label><textarea id="pc-invite">${esc(tableOnly?'Join my Table on Plated. A private place for the food we make.':'Join our household on Plated so we can plan dinner and shop together.')}</textarea><p class="p-fine" style="margin-top:12px">This preview does not send invitations. In the app, the share sheet opens next, and a seat changes only after the invitation is sent.</p>${primary('save-invite','Keep invitation draft')}`);return}if(a==='save-invite'){phone._invite=sheet.querySelector('textarea').value;closeModal();announce('Invitation draft kept in this preview.');return}
if(a==='welcome-start'){options.journey='app';options.scenario='ready';clearSample();render();return}if(a==='welcome-join'){openModal('join','Join a household',`<p class="p-sub">Open the invitation link from someone in your household. Plated will show the household and ask you to join.</p>${primary('close-modal','Back to welcome')}`);return}
});
root.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-search]')){search=t.value;libraryGrid();return}if(t.matches('[data-serving]')){updateServing(Number(t.value));return}if(t.dataset.field&&editorDraft&&route().name==='editor'){editorDraft[t.dataset.field]=t.value;return}if(t.dataset.field==='postTitle'&&postDraft){postDraft.title=t.value;return}if(t.dataset.ingredient&&editorDraft){editorDraft.ingredients.find(i=>i.id===t.dataset.ingredient).line=t.value;return}if(t.dataset.step&&editorDraft){editorDraft.steps.find(s=>s.id===t.dataset.step).text=t.value;return}if(t.dataset.plan){updatePlanner();return}if(t.matches('[data-post-caption]')&&postDraft){postDraft.caption=t.value;return}if(t.matches('[data-cook-note]')&&data.cooking)data.cooking.note=t.value});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.check){const i=shoppingItems().find(i=>i.key===t.dataset.check),checked=t.checked,scroll=main.scrollTop;commit('Grocery check',()=>setGroceryChecked(i,checked));render();main.scrollTop=scroll;return}if(t.dataset.manualCheck){const id=t.dataset.manualCheck,checked=t.checked,scroll=main.scrollTop;commit('Grocery check',()=>data.manual.find(m=>m.id===id).done=checked);render();main.scrollTop=scroll;return}if(t.matches('[data-reminders]')){const checked=t.checked;commit('Reminder preference',()=>data.profile.reminders=checked);announce('Reminder preference changed in this preview.');return}if(t.matches('[data-post-recipe]')&&postDraft){postDraft.recipeId=t.value;return}if(t.dataset.plan){planner[t.dataset.plan]=t.value;updatePlanner();return}if(t.matches('[data-recipe-photo],[data-post-photo]')){const f=t.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){announce('Choose an image file.');return}if(f.size>5*1024*1024){announce('Choose a photo smaller than 5 MB for this preview.');return}const reader=new FileReader();reader.onload=()=>{if(t.matches('[data-recipe-photo]')&&editorDraft)editorDraft.photo=reader.result;else if(postDraft)postDraft.photo=reader.result;const scroll=main.scrollTop;render();main.scrollTop=scroll};reader.onerror=()=>announce('This photo couldn’t be opened. Try another.');reader.readAsDataURL(f)}});
