<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plated screen review</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f5f3ef;color:#292620}header{padding:20px 28px;background:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);gap:32px}img{max-width:100%;max-height:78vh;object-fit:contain;display:block;margin:auto}section{min-width:0}select,button,textarea{font:inherit;border:1px solid #ccc6bc;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea{width:100%;min-height:290px;resize:vertical;line-height:1.5}label{display:block;margin:16px 0 6px}nav,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#picker{max-width:100%;flex:1}#status,.hint{color:#69645b;font-size:14px;line-height:1.5}h2{margin:0 0 12px;font-size:24px}#image-area{background:#e9e6e0;padding:16px;border-radius:12px}.hint{margin-top:20px}@media(max-width:680px){main{grid-template-columns:1fr}img{max-height:65vh}header{padding:16px}main{padding:16px}}
</style></head><body>
<header><h1>Plated screen review</h1><span id="count"></span></header>
<main><section><nav><button id="prev" aria-label="Previous screen">←</button><select id="picker" aria-label="Screen"></select><button id="next" aria-label="Next screen">→</button></nav><div id="image-area" style="margin-top:16px"><img id="screen" alt=""></div></section>
<section><h2 id="title"></h2><p id="context"></p><div class="row"><div><label for="decision">Decision</label><select id="decision"><option>Discuss</option><option>Keep</option><option>Change</option></select></div><div><label for="priority">Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><label for="note">Your feedback</label><textarea id="note" placeholder="What works? What should change? What should the result look like?"></textarea><p id="status" role="status">Loading…</p><p class="hint">Notes save to the Plated workspace. Send a message in our chat when you want me to read or discuss them. I don’t receive an automatic alert as you type.</p></section></main>
<script>
let rows=[],notes={},index=0,timer=null,chain=Promise.resolve();
const $=id=>document.getElementById(id);
async function request(url,options){const response=await fetch(url,options);if(!response.ok)throw Error('Save failed');return response.json()}
function save(){clearTimeout(timer);const value={screenId:rows[index].screenId,note:$('note').value,decision:$('decision').value,priority:$('priority').value};notes[value.screenId]=value;$('status').textContent='Saving…';chain=chain.catch(()=>{}).then(()=>request('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)})).then(()=>{$('status').textContent='Saved to workspace'}).catch(()=>{$('status').textContent='Could not save. Keep this panel open and try editing again.'});return chain}
async function show(i){if(rows.length&&$('note').dataset.loaded)await save();index=i;const row=rows[i],note=notes[row.screenId]||{};$('picker').value=i;$('title').textContent=row.screenId+' · '+row.title;$('screen').src=row.file;$('screen').alt=row.screenId+' '+row.title;$('note').value=note.note||'';$('note').dataset.loaded='yes';$('decision').value=note.decision||'Discuss';$('priority').value=note.priority||'Medium';$('prev').disabled=i===0;$('next').disabled=i===rows.length-1;$('count').textContent=(i+1)+' of '+rows.length;$('context').textContent=row.screenId.startsWith('A')?'iPhone capture with sample data':'Source layout preview';$('status').textContent='Notes save automatically';history.replaceState(null,'','#'+row.screenId)}
$('picker').onchange=e=>show(Number(e.target.value));$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);
$('note').oninput=()=>{clearTimeout(timer);$('status').textContent='Unsaved changes';timer=setTimeout(save,500)};$('note').onblur=save;$('decision').onchange=save;$('priority').onchange=save;
Promise.all([request('/api/screens'),request('/api/notes')]).then(([r,n])=>{rows=r;notes=n;rows.forEach((row,i)=>{const o=document.createElement('option');o.value=i;o.textContent=row.screenId+' · '+row.title;$('picker').append(o)});show(Math.max(0,rows.findIndex(r=>r.screenId===location.hash.slice(1))))}).catch(()=>$('status').textContent='Unable to load review');
</script></body></html>
