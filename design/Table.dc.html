<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #FF5A3C; } a:hover { color: #D6401F; }
    .feed::-webkit-scrollbar { display: none; }
    @keyframes kissPop { 0% { transform: scale(0.001); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</helmet>
<div style="width: 393px; height: 852px; background: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 24px 12px 24px; border-bottom: 1px solid #F7F3EE">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B5AC9E" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #B5AC9E">6 SEATS · INVITE ONLY</div>
      </div>
      <div style="font-family: 'Gabarito', system-ui, sans-serif; font-size: 25px; font-weight: 700; letter-spacing: -0.3px; color: #221B14">The Table</div>
    </div>
    <div style="display: flex">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #EDF5EF; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3DA35D">S</div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #FFF4DC; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #C88A00">R</div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #FFEDE3; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FF5A3C">+3</div>
    </div>
  </div>

  <div class="feed" style="flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 96px">
    <sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; padding: 16px 24px 6px 24px; border-bottom: 1px solid #F7F3EE">
        <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 10px">
          <div style="width: 38px; height: 38px; border-radius: 50%; background: {{ p.avBg }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{ p.avColor }}">{{ p.initials }}</div>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column">
            <div style="font-size: 14px; font-weight: 700; color: #221B14">{{ p.who }}</div>
            <div style="font-size: 11px; font-weight: 600; color: #B5AC9E">{{ p.when }}</div>
          </div>
          <div style="font-size: 13px; font-weight: 700; color: #221B14">Save</div>
        </div>

        <div style="position: relative">
          <img src="{{ p.img }}" style="width: 100%; height: 300px; border-radius: 20px; object-fit: cover; box-shadow: 0 8px 24px rgba(60,50,40,0.10)">
          <sc-if value="{{ p.kissed }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: -10px; right: -6px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #EFECE7; border-radius: 999px; padding: 8px 14px; box-shadow: 0 8px 20px rgba(60,50,40,0.14); animation: kissPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFB020"><path d="M12 2c1 3 3 4 5 4-2 1-3 2-3 4 0-2-1-3-3-4 2 0 1-2 1-4Zm-5 8c.7 2 2 2.7 3.3 2.7-1.3.6-2 1.3-2 2.6 0-1.3-.7-2-2-2.6 1.3 0 .7-1.4.7-2.7Z"></path><circle cx="14" cy="17" r="4" fill="#FFB020"></circle></svg>
              <span style="font-size: 13px; font-weight: 700; color: #221B14">Chef's kiss</span>
            </div>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 2px 0 2px">
          <div style="display: flex; align-items: center; gap: 14px">
            <div onClick="{{ p.plate }}" style="display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 6px 0; min-height: 44px">
              <div style="transform: scale({{ p.plateScale }}); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="{{ p.plateFill }}" stroke="{{ p.plateStroke }}" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4" fill="{{ p.plateInner }}" stroke="none"></circle></svg>
              </div>
              <span style="font-size: 14px; font-weight: 700; color: {{ p.countColor }}">{{ p.count }}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 7px; padding: 6px 0; min-height: 40px">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8074" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5Z"></path></svg>
              <span style="font-size: 14px; font-weight: 700; color: #8A8074">{{ p.comments }}</span>
            </div>
          </div>
          <div style="font-size: 14px; color: #221B14; line-height: 1.4"><span style="font-weight: 700">{{ p.who }}</span>&nbsp;&nbsp;{{ p.caption }}</div>
          <sc-if value="{{ p.hasLink }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 8px; padding-top: 2px">
              <div style="font-size: 13px; color: #8A8074"><span style="font-weight: 700; color: #221B14">{{ p.commenter }}</span>&nbsp;&nbsp;{{ p.commentText }}</div>
            </div>
            <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; margin-top: 4px; height: 30px; padding: 0 12px; border-radius: 999px; background: #F7F5F1; border: 1px solid #EFECE7">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF5A3C" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"></path></svg>
              <span style="font-size: 12px; font-weight: 700; color: #FF5A3C">{{ p.linkLabel }}</span>
            </div>
          </sc-if>
          <div style="font-size: 12px; font-weight: 600; color: #B5AC9E; padding: 2px 0 8px 0">Add a comment for {{ p.firstName }}…</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; height: 68px; background: rgba(255,255,255,0.94); backdrop-filter: blur(16px); border: 1px solid #EFECE7; border-radius: 999px; box-shadow: 0 12px 32px rgba(60,50,40,0.08); display: flex; align-items: center; padding: 0 8px">
    <div onClick="{{ bWeek }}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B5AC9E; cursor: pointer; align-self: stretch; min-height: 66px; transform: scale({{ sWeek }}); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="4"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 700">Plan</span>
    </div>
    <div onClick="{{ bTable }}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #221B14; cursor: pointer; align-self: stretch; min-height: 66px; transform: scale({{ sTable }}); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle></svg>
      <span style="font-size: 10px; font-weight: 800">Table</span>
    </div>
    <div onClick="{{ bAdd }}" style="flex: 0 0 72px; display: flex; justify-content: center; cursor: pointer">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #FF5A3C; box-shadow: 0 8px 20px rgba(60,50,40,0.16); display: flex; align-items: center; justify-content: center; transform: scale({{ sAdd }}) rotate({{ rAdd }}); transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div onClick="{{ bBook }}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B5AC9E; cursor: pointer; align-self: stretch; min-height: 66px; transform: scale({{ sBook }}); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5Z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>
      <span style="font-size: 10px; font-weight: 700">Recipes</span>
    </div>
    <div onClick="{{ bHome }}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B5AC9E; cursor: pointer; align-self: stretch; min-height: 66px; transform: scale({{ sHome }}); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c1.2-3 3.5-4.5 6-4.5s4.8 1.5 6 4.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 15.7c2 .3 3.6 1.6 4.5 3.8"></path></svg>
      <span style="font-size: 10px; font-weight: 700">Home</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plated: {}, bounce: null, navBounce: null };
  }

  bounceNav(key) {
    this.navSeq = (this.navSeq || 0) + 1;
    const seq = this.navSeq;
    this.setState({ navBounce: key });
    setTimeout(() => {
      if (this.navSeq === seq) { this.setState({ navBounce: null }); }
    }, 300);
  }

  renderVals() {
    const s = this.state;
    const posts = [
      { id: 'p1', who: 'Sam Meadows', firstName: 'Sam', initials: 'SM', avBg: '#EDF5EF', avColor: '#3DA35D', when: 'Tonight · 7:42 PM', img: "pancakes.jpg", caption: 'Breakfast for dinner. Zero regrets, full syrup.', base: 9, comments: '3',
        hasLink: true, commenter: 'Grandma', commentText: 'This is the recipe I told you about —', linkLabel: 'cooking.nytimes.com' },
      { id: 'p2', who: 'Dan Alvarez', firstName: 'Dan', initials: 'DA', avBg: '#FFF4DC', avColor: '#C88A00', when: 'Yesterday · 6:15 PM', img: "skewers.jpg", caption: 'Grill season never ends at this table.', base: 5, comments: '2', hasLink: false },
      { id: 'p3', who: 'Maya Chen', firstName: 'Maya', initials: 'MC', avBg: '#F5EDFB', avColor: '#B95CF4', when: 'Tuesday · 8:03 PM', img: "veggie.jpg", caption: 'Twenty minutes, one bowl, every color.', base: 3, comments: '1', hasLink: false }
    ].map((p) => {
      const plated = !!s.plated[p.id];
      const count = p.base + (plated ? 1 : 0);
      return { ...p,
        count: String(count),
        kissed: count >= 10,
        plateFill: plated ? '#FF5A3C' : 'none',
        plateStroke: plated ? '#FF5A3C' : '#8A8074',
        plateInner: plated ? '#FFFFFF' : 'none',
        countColor: plated ? '#FF5A3C' : '#8A8074',
        plateScale: s.bounce === p.id ? '1.35' : '1',
        plate: () => {
          this.plateSeq = (this.plateSeq || 0) + 1;
          const seq = this.plateSeq;
          this.setState({ plated: { ...s.plated, [p.id]: !plated }, bounce: p.id });
          setTimeout(() => {
            if (this.plateSeq === seq) { this.setState({ bounce: null }); }
          }, 320);
        }
      };
    });
    const sc = (key) => (s.navBounce === key ? '1.3' : '1');
    return { posts,
      bWeek: () => this.bounceNav('week'), sWeek: sc('week'),
      bTable: () => this.bounceNav('table'), sTable: sc('table'),
      bAdd: () => this.bounceNav('add'), sAdd: s.navBounce === 'add' ? '1.15' : '1', rAdd: s.navBounce === 'add' ? '90deg' : '0deg',
      bBook: () => this.bounceNav('book'), sBook: sc('book'),
      bHome: () => this.bounceNav('home'), sHome: sc('home')
    };
  }
}
</script>
</body>
</html>
